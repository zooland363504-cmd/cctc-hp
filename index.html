<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>CCTC ホームページ デザイン案</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;background:#f4f5f7;color:#222;line-height:1.8;padding:48px 5vw}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:1.6rem;margin-bottom:.4rem}
p.lead{color:#555;margin-bottom:2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.2rem}
a.card{display:block;text-decoration:none;color:inherit;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.1);transition:.2s;background:#fff}
a.card:hover{transform:translateY(-4px)}
.sw{height:120px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.4rem;letter-spacing:.1em}
.s1{background:linear-gradient(115deg,#0b1f3a 60%,#c6f432 60%);color:#fff}
.s2{background:#faf8f5;color:#1a1a1a;font-family:serif;border-bottom:1px solid #ddd}
.s3{background:linear-gradient(120deg,#7c5cff,#00e0c6,#ff5c93);color:#fff}
.body{padding:1rem 1.2rem}
.body h2{font-size:1.1rem}
.body p{font-size:.9rem;color:#666}
footer{margin-top:2.4rem;font-size:.8rem;color:#888}
</style>
</head>
<body>
<div class="wrap">
  <h1>CCTC ホームページ デザイン案</h1>
  <p class="lead">コミュニケーション・コア・テニスクラブ(CCTC)の新ホームページ候補です。気に入ったものを選んでご意見をお聞かせください。(中身の文言は現サイトと同じです)</p>
  <div class="grid">
    <a class="card" href="pattern-sporty/"><div class="sw s1">SPORTY</div><div class="body"><h2>スポーティー</h2><p>ネイビー×ライム。力強く元気な印象。</p></div></a>
    <a class="card" href="pattern-stylish/"><div class="sw s2">STYLISH</div><div class="body"><h2>スタイリッシュ</h2><p>余白と明朝体。落ち着いた大人の雰囲気。</p></div></a>
    <a class="card" href="pattern-modern/"><div class="sw s3">MODERN</div><div class="body"><h2>モダン</h2><p>ダーク×グラデーション。若い世代向け。</p></div></a>
  </div>
  <footer>※制作中の仮ページです。お問い合わせフォームは準備中です。</footer>
</div>
</body>
</html>
